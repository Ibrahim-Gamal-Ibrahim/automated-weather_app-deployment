controller:
  admin:
    username: admin
    password: admin123

  serviceType: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.local

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - credentials-binding
    - configuration-as-code

persistence:
  enabled: true
  size: 3Gi
  storageClass: standard

serviceAccount:
  create: true
  name: jenkins
