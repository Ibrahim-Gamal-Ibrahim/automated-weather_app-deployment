apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-job

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: mysql-init-container
          image: mysql:5.7

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password

            - name: MYSQL_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: auth-password

            - name: MYSQL_USER
              value: authuser

            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_PORT
              value: "3306"

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Waiting for MySQL..."

              until mysqladmin ping \
                -h"${MYSQL_HOST}" \
                -P"${MYSQL_PORT}" \
                -uroot \
                -p"${MYSQL_ROOT_PASSWORD}" \
                --silent;
              do
                sleep 2
              done

              echo "MySQL is ready."

              mysql \
                -h"${MYSQL_HOST}" \
                -P"${MYSQL_PORT}" \
                -uroot \
                -p"${MYSQL_ROOT_PASSWORD}" <<EOF

              CREATE DATABASE IF NOT EXISTS weatherapp;

              CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%'
              IDENTIFIED BY '${MYSQL_AUTH_PASSWORD}';

              GRANT ALL PRIVILEGES
              ON weatherapp.*
              TO '${MYSQL_USER}'@'%';

              FLUSH PRIVILEGES;

              EOF

              echo "Database initialization completed."